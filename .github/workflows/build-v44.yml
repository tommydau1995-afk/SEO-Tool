name: Build SEO AI Studio V4.4 Setup

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app_v44.py"
      - "seo_v44_keywords.py"
      - "generate_user_guide_v44.py"
      - "requirements_v44.txt"
      - "SEO_AI_Studio_V44.spec"
      - "installer_v44.iss"
      - "tests/test_v44_keywords.py"
      - "assets/**"
      - ".github/workflows/build-v44.yml"

jobs:
  test-build-and-document:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_v44.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_v44.txt

      - name: Generate beginner guide
        run: |
          python generate_user_guide_v44.py
          python -c "from pathlib import Path; p=Path('output/pdf/Huong_Dan_Su_Dung_SEO_AI_Studio_V44.pdf'); assert p.exists() and p.stat().st_size > 30000 and p.read_bytes().startswith(b'%PDF')"

      - name: Verify Python and run tests
        run: |
          python -m py_compile app_v44.py seo_v44_keywords.py generate_user_guide_v44.py
          python -m unittest tests/test_v44_keywords.py tests/test_v43_core.py tests/test_v4_core.py -v

      - name: Build standalone EXE
        run: pyinstaller --clean --noconfirm SEO_AI_Studio_V44.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SEO_AI_Studio_V44.exe")) {
            throw "SEO_AI_Studio_V44.exe was not created"
          }
          Get-Item "dist\SEO_AI_Studio_V44.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_v44.iss

      - name: Create SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "installer_output\SEO_AI_Studio_V44_Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SEO_AI_Studio_V44_Setup.exe" | Out-File "installer_output\SHA256SUMS.txt" -Encoding ascii

      - name: Upload installer and guide
        uses: actions/upload-artifact@v4
        with:
          name: SEO-AI-Studio-V44-Setup-and-Guide
          path: |
            installer_output/SEO_AI_Studio_V44_Setup.exe
            installer_output/SHA256SUMS.txt
            output/pdf/Huong_Dan_Su_Dung_SEO_AI_Studio_V44.pdf
          if-no-files-found: error
          retention-days: 30
